<html lang="en" data-theme="light">

    <meta charset="UTF-8" />

    <meta name="description" content="A considered library of customizable AI prompts for the work behind the work." />
    <title>Prompt Library — A field guide to better work</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('prompt-library-theme')
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : systemPrefersDark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
